<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#fbf6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ash Kuaför · Günlük Görev Programı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#fbf6f3;
    --ink:#2b1f23;
    --ink-soft:#4a3a40;
    --muted:#9a8a92;
    --rose:#a8516e;
    --rose-dark:#7c3a50;
    --gold:#c9a24a;
    --line:rgba(168,81,110,.12);
    --shadow-sm:0 2px 10px rgba(124,58,80,.06);
    --shadow-md:0 6px 24px rgba(124,58,80,.08);
  }

  html{ -webkit-text-size-adjust:100%; touch-action:manipulation; }

  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(620px 420px at 8% -8%, rgba(168,81,110,.16), transparent 65%),
      radial-gradient(520px 400px at 96% 2%, rgba(201,162,74,.14), transparent 65%),
      radial-gradient(700px 520px at 50% 108%, rgba(168,81,110,.10), transparent 65%);
  }

  /* ============ ÜST BAR ============ */
  .topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(251,246,243,.80);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    backdrop-filter:blur(18px) saturate(180%);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .topbar-inner{
    max-width:1120px;
    margin:0 auto;
    padding:11px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .brand{display:flex;flex-direction:column;line-height:1;user-select:none}
  .brand b{
    font-family:'Playfair Display',Georgia,serif;
    font-size:20px;font-weight:600;
    letter-spacing:.30em;text-indent:.30em;
    color:var(--rose-dark);
  }
  .brand small{
    font-size:7.5px;font-weight:700;
    letter-spacing:.52em;text-indent:.52em;
    color:var(--gold);margin-top:4px;
  }
  .today-btn{
    font:inherit;
    font-size:10.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;
    padding:9px 15px;
    border-radius:100px;
    border:1px solid rgba(168,81,110,.28);
    background:#fff;
    color:var(--rose-dark);
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:all .22s ease;
    white-space:nowrap;
    touch-action:manipulation;
  }
  .today-btn:active{transform:scale(.93)}
  .today-btn.hide{opacity:0;pointer-events:none;transform:scale(.9)}

  /* ============ ANA SARMAL ============ */
  .wrap{
    position:relative;
    z-index:1;
    max-width:1120px;
    margin:0 auto;
    padding:16px 14px 0;
  }

  /* ============ HAFTALIK PANEL ============ */
  .week-panel{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:15px 10px;
    margin-bottom:14px;
    border-radius:22px;
    background:linear-gradient(155deg,#ffffff 0%,#fdf7f4 100%);
    border:1px solid var(--line);
    box-shadow:var(--shadow-md);
    overflow:hidden;
  }
  .week-panel::before{
    content:'';
    position:absolute;
    top:-70px;right:-60px;
    width:200px;height:200px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(201,162,74,.16),transparent 70%);
    pointer-events:none;
  }
  .week-panel::after{
    content:'';
    position:absolute;
    bottom:-80px;left:-50px;
    width:180px;height:180px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(168,81,110,.10),transparent 70%);
    pointer-events:none;
  }
  .nav-btn{
    position:relative;
    z-index:2;
    width:44px;height:44px;
    flex:0 0 auto;
    display:grid;place-items:center;
    border-radius:15px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--rose);
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:all .18s ease;
    touch-action:manipulation;
  }
  .nav-btn svg{width:18px;height:18px}
  .nav-btn:active{transform:scale(.90);background:var(--rose);color:#fff;border-color:var(--rose)}

  .week-meta{
    position:relative;
    z-index:2;
    flex:1;
    min-width:0;
    text-align:center;
    padding:0 2px;
  }
  .eyebrow{
    font-size:8.5px;
    font-weight:700;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  .week-dates{
    font-family:'Playfair Display',Georgia,serif;
    font-size:16px;
    font-weight:600;
    line-height:1.3;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .week-badge{
    display:inline-block;
    margin-top:7px;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--rose);
    background:rgba(168,81,110,.10);
    padding:3px 11px;
    border-radius:100px;
  }

  /* ============ GÜN SEKMELERİ ============ */
  .day-tabs{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    margin-bottom:16px;
  }
  .day-tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    min-height:54px;
    padding:7px 2px;
    border-radius:13px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    font:inherit;
    color:var(--ink);
    box-shadow:0 1px 4px rgba(124,58,80,.04);
    transition:all .18s ease;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    min-width:0;
    overflow:hidden;
  }
  .day-tab .dn{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.02em;
    line-height:1;
  }
  .day-tab .dc{
    font-size:9px;
    font-weight:700;
    min-width:16px;
    padding:1px 5px;
    border-radius:100px;
    background:rgba(168,81,110,.09);
    color:var(--rose-dark);
    line-height:1.4;
    text-align:center;
  }
  .day-tab.few .dc{
    background:rgba(201,162,74,.20);
    color:#8a6a20;
  }
  .day-tab.zero{
    background:#f5efec;
    border-color:rgba(168,81,110,.06);
    box-shadow:none;
  }
  .day-tab.zero .dn{color:#a898a0;font-weight:600}
  .day-tab.zero .dc{background:rgba(154,138,146,.15);color:#8a7a82}
  .day-tab.active{
    background:linear-gradient(135deg,var(--rose),#c06080);
    border-color:var(--rose);
    box-shadow:0 5px 14px rgba(168,81,110,.28);
    color:#fff;
  }
  .day-tab.active .dn{color:#fff}
  .day-tab.active .dc{
    background:rgba(255,255,255,.28);
    color:#fff;
  }
  .day-tab:active{transform:scale(.95)}

  /* ============ GÜN BAŞLIĞI ============ */
  .day-header{
    padding:0 4px;
    margin-bottom:14px;
  }
  .dh-date{
    font-family:'Playfair Display',Georgia,serif;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    line-height:1.25;
    margin-bottom:3px;
  }
  .dh-today{
    display:inline-block;
    font-family:'Inter',sans-serif;
    font-size:8.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#fff;
    background:var(--rose);
    padding:2.5px 8px;
    border-radius:100px;
    margin-left:6px;
    vertical-align:middle;
    position:relative;
    top:-1px;
  }
  .dh-meta{
    font-size:11.5px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:.01em;
  }

  /* ============ KART IZGARASI ============ */
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  @media(min-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  }
  @media(min-width:880px){
    .grid{grid-template-columns:repeat(3,1fr);gap:16px}
  }
  @media(min-width:1180px){
    .grid{grid-template-columns:repeat(4,1fr)}
  }

  /* ============ KİŞİ KARTI ============ */
  @keyframes cardIn{
    from{opacity:0;transform:translateY(10px) scale(.985)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .card{
    position:relative;
    background:#fff;
    border-radius:20px;
    padding:14px 14px 13px;
    border:1px solid rgba(0,0,0,.045);
    box-shadow:0 3px 16px rgba(124,58,80,.06);
    overflow:hidden;
    animation:cardIn .42s cubic-bezier(.22,.9,.3,1) backwards;
  }
  .card::before{
    content:'';
    position:absolute;
    left:0;top:0;bottom:0;
    width:4px;
    background:linear-gradient(180deg,var(--c),var(--c2));
    opacity:.95;
  }
  .card::after{
    content:'';
    position:absolute;
    top:-70px;right:-50px;
    width:170px;height:170px;
    border-radius:50%;
    background:radial-gradient(circle,var(--soft),transparent 70%);
    pointer-events:none;
  }

  .card-head{
    position:relative;
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:12px;
  }
  .avatar{
    width:42px;height:42px;
    flex:0 0 auto;
    display:grid;place-items:center;
    border-radius:13px;
    font-family:'Playfair Display',Georgia,serif;
    font-size:19px;font-weight:600;
    color:#fff;
    background:linear-gradient(135deg,var(--c),var(--c2));
    box-shadow:0 4px 12px var(--soft);
  }
  .who{min-width:0;flex:1}
  .who h2{
    font-size:15px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cnt{
    flex:0 0 auto;
    min-width:26px;height:26px;
    padding:0 7px;
    display:grid;place-items:center;
    border-radius:100px;
    font-size:11.5px;
    font-weight:700;
    color:var(--c);
    background:var(--soft);
  }

  /* ============ GÖREV LİSTESİ ============ */
  .tasks{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .task{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 9px;
    border-radius:12px;
    background:#fdfaf9;
    border:1px solid rgba(168,81,110,.07);
    font-size:12.5px;
    line-height:1.3;
    color:var(--ink-soft);
    font-weight:500;
  }
  .ico{
    width:26px;height:26px;
    flex:0 0 auto;
    display:grid;place-items:center;
    border-radius:8px;
    font-size:13px;
    background:var(--soft);
    line-height:1;
  }
  .task span:last-child{
    min-width:0;
    word-break:break-word;
  }

  /* ============ BOŞ GÜN ============ */
  .empty-day{
    grid-column:1 / -1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:38px 20px;
    border-radius:22px;
    background:#fff;
    border:1px dashed rgba(168,81,110,.22);
    text-align:center;
    box-shadow:0 3px 16px rgba(124,58,80,.05);
  }
  .empty-ico{font-size:34px;line-height:1}
  .empty-title{
    font-family:'Playfair Display',Georgia,serif;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
  }
  .empty-sub{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    max-width:280px;
  }

  /* ============ İZİNLİ NOTU ============ */
  .off-note{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
    margin-top:16px;
    padding:11px 14px;
    border-radius:14px;
    background:rgba(201,162,74,.08);
    border:1px solid rgba(201,162,74,.18);
    font-size:11.5px;
    line-height:1.4;
    color:#6b5a2e;
    font-weight:500;
  }
  .off-note .off-icon{font-size:13px}
  .off-note b{color:#5a4a20;font-weight:700}
  .off-note .off-sep{opacity:.5;margin:0 2px}
  .off-note .off-sub{color:#8a6a20}
  .off-note.hidden{display:none}

  /* ============ ALT ============ */
  .foot{
    text-align:center;
    font-size:10.5px;
    line-height:1.7;
    color:var(--muted);
    margin:20px 0 0;
    padding:0 12px;
  }

  /* ============ KÜÇÜK TELEFONLAR ============ */
  @media(max-width:360px){
    .wrap{padding:14px 11px 0}
    .brand b{font-size:18px}
    .week-dates{font-size:14.5px}
    .week-panel{padding:13px 8px}
    .nav-btn{width:40px;height:40px;border-radius:13px}
    .avatar{width:38px;height:38px;font-size:17px;border-radius:12px}
    .task{font-size:11.8px;padding:7px 8px}
    .ico{width:24px;height:24px;font-size:12px}
    .day-tab{min-height:50px;padding:6px 1px;border-radius:11px}
    .day-tab .dn{font-size:9.5px}
    .day-tab .dc{font-size:8.5px;padding:1px 4px}
    .dh-date{font-size:15.5px}
  }

  /* ============ YATAY TELEFON ============ */
  @media(max-height:480px) and (orientation:landscape){
    .week-panel{padding:10px 12px;margin-bottom:12px}
    .eyebrow{display:none}
    .week-badge{margin-top:5px}
    .week-dates{font-size:15px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <b>ASH</b>
      <small>KUAFÖR</small>
    </div>
    <button class="today-btn hide" id="todayBtn">Bugüne Dön</button>
  </div>
</header>

<div class="wrap">

  <!-- HAFTALIK PANEL -->
  <section class="week-panel" aria-label="Hafta seçici">
    <button class="nav-btn" id="prev" aria-label="Önceki hafta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div class="week-meta">
      <div class="eyebrow">Haftalık Program</div>
      <div class="week-dates" id="dates">—</div>
      <div class="week-badge" id="badge">Bu Hafta</div>
    </div>

    <button class="nav-btn" id="next" aria-label="Sonraki hafta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </section>

  <!-- GÜN SEKMELERİ -->
  <nav class="day-tabs" id="dayTabs" aria-label="Gün seçici"></nav>

  <!-- GÜN BAŞLIĞI -->
  <div class="day-header" id="dayHeader"></div>

  <!-- KARTLAR -->
  <main class="grid" id="grid"></main>

  <!-- İZİNLİ NOTU -->
  <p class="off-note hidden" id="offNote"></p>

  <p class="foot">Cuma günleri sırayla bir çırak nöbetçi olur · Diğer günler izinlere göre eşit dağıtılır</p>

</div>

<script>
/* =========================================================
   1) VERİLER
   ========================================================= */

const PEOPLE = [
  { name:'Tahan',   c:'#a8516e', c2:'#c76d8a', soft:'rgba(168,81,110,.11)' },
  { name:'Ezel',    c:'#b8923a', c2:'#d6b25c', soft:'rgba(201,162,74,.13)' },
  { name:'Hira',    c:'#6d7f62', c2:'#8fa383', soft:'rgba(122,139,111,.13)' },
  { name:'Sofia',   c:'#a06a42', c2:'#c48e62', soft:'rgba(176,120,79,.13)' },
  { name:'Müberra', c:'#7d63a0', c2:'#9c83c0', soft:'rgba(138,111,168,.13)' },
  { name:'Irmak',   c:'#338580', c2:'#57a8a3', soft:'rgba(63,143,138,.13)' },
  { name:'Zeynep',  c:'#a85252', c2:'#c87272', soft:'rgba(184,92,92,.13)' }
];

/* İzin günleri: 0=Pzt, 1=Sal, 2=Çar, 3=Per, 4=Cum, 5=Cmt, 6=Paz */
const OFF_DAYS = {
  'Tahan':   [1, 4],   // Salı, Cuma
  'Ezel':    [3, 4],   // Perşembe, Cuma
  'Müberra': [3, 4],   // Perşembe, Cuma
  'Irmak':   [3, 4],   // Perşembe, Cuma
  'Zeynep':  [0, 4],   // Pazartesi, Cuma
  'Hira':    [3, 4],   // Perşembe, Cuma
  'Sofia':   [3, 4]    // Perşembe, Cuma
};

/* Kesim arabası hariç dönen görevler (yeni görevler eklendi) */
const TASKS = [
  'Yer Silme',
  'Yer Süpürme',
  'Toz Alma',
  'Mutfak',
  'Yıkama Seti',
  'Havlular',
  'Tuvalet',
  'Boya Arabaları',
  'Ağda Odası',
  'Bakım Odası',
  'Aynalar',
  'Çöpler',
  'Makyaj Bölümü',
  'Koltuklar',
  'Fön Makineleri',
  'Fırçalar',
  'Manikür Alanı',
  'Tente',
  "Semih Bey'in Odası"
];

const ICONS = {
  'Yer Silme':'🧽',
  'Yer Süpürme':'🧹',
  'Toz Alma':'🧴',
  'Mutfak':'☕',
  'Yıkama Seti':'🚿',
  'Havlular':'🧺',
  'Tuvalet':'🚽',
  'Boya Arabaları':'🎨',
  'Ağda Odası':'🕯️',
  'Bakım Odası':'💆',
  'Aynalar':'🪞',
  'Çöpler':'🗑️',
  'Makyaj Bölümü':'💄',
  'Koltuklar':'🛋️',
  'Fön Makineleri':'💨',
  'Fırçalar':'🖌️',
  'Manikür Alanı':'💅',
  'Tente':'⛱️',
  "Semih Bey'in Odası":'🚪',
  'Kesim Arabası Temizliği':'✂️'
};

const FIXED_TASK  = 'Kesim Arabası Temizliği';
const FIXED_OWNER = 'Tahan';
const BASE_MONDAY = new Date(2024, 0, 1);

const DAY_SHORT = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

/* =========================================================
   2) YARDIMCI FONKSİYONLAR
   ========================================================= */

const pad = n => String(n).padStart(2, '0');
const mod = (n, m) => ((n % m) + m) % m;

function startOfWeek(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  return x;
}

function fmtRange(a, b){
  const o = { day:'numeric', month:'long' };
  const sa = a.toLocaleDateString('tr-TR', o);
  const sb = b.toLocaleDateString('tr-TR', o);
  const ya = a.getFullYear(), yb = b.getFullYear();
  return ya === yb ? `${sa} – ${sb} ${ya}` : `${sa} ${ya} – ${sb} ${yb}`;
}

const THIS_MONDAY = startOfWeek(new Date());
const AUTO_INDEX  = Math.round((THIS_MONDAY - BASE_MONDAY) / 604800000);
const TODAY_IDX   = (new Date().getDay() + 6) % 7;

/* =========================================================
   3) GÜNLÜK ÇALIŞANLAR
   Cuma (4) hariç: izin listesine göre
   Cuma: haftalık rotasyonla tek kişi
   ========================================================= */

function getWorkers(dayIdx, weekIdx){
  if (dayIdx === 4){
    return [ PEOPLE[ mod(weekIdx, PEOPLE.length) ] ];
  }
  return PEOPLE.filter(p => !OFF_DAYS[p.name].includes(dayIdx));
}

/* =========================================================
   4) GÜNLÜK PLAN ÜRETİCİ
   ========================================================= */

function buildDayPlan(weekIdx, dayIdx){
  const workers = getWorkers(dayIdx, weekIdx);
  const n = workers.length;

  if (n === 0){
    return { workers: [], plan: {}, totalTasks: 0, empty: true };
  }

  const hasTahan = workers.some(p => p.name === FIXED_OWNER);
  const totalTasks = TASKS.length + (hasTahan ? 1 : 0);

  const base  = Math.floor(totalTasks / n);
  const extra = totalTasks % n;

  const rotSeed    = weekIdx * 13 + dayIdx * 5 + 1;
  const extraStart = mod(rotSeed, n);
  const orderStart = mod(rotSeed + Math.floor(n / 2), n);

  const extraSet = new Set();
  for (let i = 0; i < extra; i++) extraSet.add(mod(extraStart + i, n));

  const targetCount = {};
  workers.forEach((w, i) => {
    targetCount[w.name] = base + (extraSet.has(i) ? 1 : 0);
  });

  const poolSeed = weekIdx * 7 + dayIdx;
  const pool = [];
  for (let k = 0; k < TASKS.length; k++){
    pool.push(TASKS[mod(poolSeed + k, TASKS.length)]);
  }

  const plan = {};
  workers.forEach(p => plan[p.name] = []);

  if (hasTahan){
    plan[FIXED_OWNER].push(FIXED_TASK);
    targetCount[FIXED_OWNER] -= 1;
  }

  let pIdx = 0;
  for (let i = 0; i < n; i++){
    const w = workers[mod(orderStart + i, n)];
    const count = targetCount[w.name];
    for (let c = 0; c < count; c++){
      if (pIdx < pool.length){
        plan[w.name].push(pool[pIdx++]);
      }
    }
  }

  return { workers, plan, totalTasks };
}

/* =========================================================
   5) DURUM
   ========================================================= */

let offset    = 0;
let activeDay = TODAY_IDX;

/* =========================================================
   6) ÇİZİM
   ========================================================= */

const $grid     = document.getElementById('grid');
const $days     = document.getElementById('dayTabs');
const $dates    = document.getElementById('dates');
const $badge    = document.getElementById('badge');
const $header   = document.getElementById('dayHeader');
const $offNote  = document.getElementById('offNote');
const $todayBtn = document.getElementById('todayBtn');

function currentMonday(){
  const m = new Date(THIS_MONDAY);
  m.setDate(m.getDate() + offset * 7);
  return m;
}

/* --- Gün sekmeleri --- */
function renderDayTabs(){
  const weekIdx = AUTO_INDEX + offset;
  $days.innerHTML = '';

  for (let d = 0; d < 7; d++){
    const count = getWorkers(d, weekIdx).length;

    const btn = document.createElement('button');
    btn.className = 'day-tab';
    if (d === activeDay) btn.classList.add('active');

    if (count === 0) btn.classList.add('zero');
    else if (count <= 3) btn.classList.add('few');

    const dn = document.createElement('span');
    dn.className = 'dn';
    dn.textContent = DAY_SHORT[d];

    const dc = document.createElement('span');
    dc.className = 'dc';
    dc.textContent = count;

    btn.append(dn, dc);

    btn.addEventListener('click', () => {
      activeDay = d;
      render();
    });

    $days.appendChild(btn);
  }
}

/* --- O günün kartları --- */
function renderCards(monday){
  const weekIdx = AUTO_INDEX + offset;
  const { workers, plan, totalTasks } = buildDayPlan(weekIdx, activeDay);

  /* Gün başlığı */
  const dayDate = new Date(monday);
  dayDate.setDate(dayDate.getDate() + activeDay);
  const dateStr = dayDate.toLocaleDateString('tr-TR', {
    weekday: 'long', day: 'numeric', month: 'long'
  });

  const isToday = offset === 0 && activeDay === TODAY_IDX;

  let meta;
  if (workers.length === 0) meta = 'Tüm çıraklar izinli';
  else if (activeDay === 4) meta = `Cuma nöbetçisi · ${totalTasks} görev`;
  else meta = `${workers.length} çırak · ${totalTasks} görev`;

  $header.innerHTML = `
    <div class="dh-date">${dateStr}${isToday ? '<span class="dh-today">Bugün</span>' : ''}</div>
    <div class="dh-meta">${meta}</div>
  `;

  /* Boş gün */
  if (workers.length === 0){
    $grid.innerHTML = `
      <div class="empty-day">
        <div class="empty-ico">🌸</div>
        <div class="empty-title">Bugün tüm çıraklar izinli</div>
        <div class="empty-sub">Bu gün için görev dağılımı yok. Diğer günlere göz atabilirsin.</div>
      </div>
    `;
    $offNote.classList.add('hidden');
    $offNote.innerHTML = '';
    return;
  }

  /* Kartlar */
  $grid.innerHTML = '';

  workers.forEach((person, i) => {
    const tasks = plan[person.name];

    const card = document.createElement('article');
    card.className = 'card';
    card.style.setProperty('--c', person.c);
    card.style.setProperty('--c2', person.c2);
    card.style.setProperty('--soft', person.soft);
    card.style.animationDelay = (i * 45) + 'ms';

    const head = document.createElement('div');
    head.className = 'card-head';

    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = person.name.charAt(0);

    const who = document.createElement('div');
    who.className = 'who';
    const h2 = document.createElement('h2');
    h2.textContent = person.name;
    who.appendChild(h2);

    const cnt = document.createElement('div');
    cnt.className = 'cnt';
    cnt.textContent = tasks.length;

    head.append(av, who, cnt);

    const ul = document.createElement('ul');
    ul.className = 'tasks';

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task';

      const ic = document.createElement('span');
      ic.className = 'ico';
      ic.textContent = ICONS[task] || '•';

      const tx = document.createElement('span');
      tx.textContent = task;

      li.append(ic, tx);
      ul.appendChild(li);
    });

    card.append(head, ul);
    $grid.appendChild(card);
  });

  /* İzinli notu */
  if (activeDay === 4){
    const worker = workers[0];
    $offNote.classList.remove('hidden');
    $offNote.innerHTML =
      `<span class="off-icon">🌟</span><span>Cuma nöbetçisi: <b>${worker.name}</b></span>` +
      `<span class="off-sep">·</span><span class="off-sub">Diğer çıraklar izinli</span>`;
    return;
  }

  const offPeople = PEOPLE.filter(p => OFF_DAYS[p.name].includes(activeDay));

  if (offPeople.length === 0){
    $offNote.classList.add('hidden');
    $offNote.innerHTML = '';
  } else {
    $offNote.classList.remove('hidden');

    const names = offPeople.map(p => p.name).join(', ');
    let html = `<span class="off-icon">🌙</span><span>İzinli: <b>${names}</b></span>`;

    if (offPeople.some(p => p.name === FIXED_OWNER)){
      html += `<span class="off-sep">·</span><span class="off-sub">Kesim Arabası bugün yapılmıyor</span>`;
    }

    $offNote.innerHTML = html;
  }
}

/* --- Tam çizim --- */
function render(){
  const monday = currentMonday();
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);

  $dates.textContent = fmtRange(monday, sunday);

  $badge.textContent =
    offset === 0  ? 'Bu Hafta' :
    offset === 1  ? 'Gelecek Hafta' :
    offset === -1 ? 'Geçen Hafta' :
    offset > 0    ? `${offset} Hafta Sonra` : `${-offset} Hafta Önce`;

  $todayBtn.classList.toggle('hide', offset === 0 && activeDay === TODAY_IDX);

  renderDayTabs();
  renderCards(monday);
}

/* =========================================================
   7) OLAYLAR
   ========================================================= */

function goPrevWeek(){ offset -= 1; render(); }
function goNextWeek(){ offset += 1; render(); }
function goPrevDay(){ if (activeDay > 0){ activeDay -= 1; render(); } }
function goNextDay(){ if (activeDay < 6){ activeDay += 1; render(); } }

document.getElementById('prev').addEventListener('click', goPrevWeek);
document.getElementById('next').addEventListener('click', goNextWeek);

$todayBtn.addEventListener('click', () => {
  offset = 0;
  activeDay = TODAY_IDX;
  render();
});

/* --- Kaydırma: kartlar üzerinde sağa/sola = gün değiştir --- */
let tX = 0, tY = 0, tTime = 0;

$grid.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  tX = e.touches[0].clientX;
  tY = e.touches[0].clientY;
  tTime = Date.now();
}, { passive:true });

$grid.addEventListener('touchend', e => {
  if (!e.changedTouches || !e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - tX;
  const dy = e.changedTouches[0].clientY - tY;
  const dt = Date.now() - tTime;

  if (dt < 600 && Math.abs(dx) > 65 && Math.abs(dy) < 55){
    if (dx < 0) goNextDay(); else goPrevDay();
  }
}, { passive:true });

/* --- Klavye okları --- */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  goPrevDay();
  if (e.key === 'ArrowRight') goNextDay();
});

/* Başlat */
render();
</script>
